name: Pages

# brlauuu.github.io/flatpare redirects to flatpare.com (#325). The site is the
# two static files in github-pages/, published as they are: no build, no
# Jekyll, and nothing else from the repository (docs/ holds design notes that
# are not meant to become a website).

on:
  push:
    branches: [main]
    paths: ["github-pages/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages
      - id: deployment
        uses: actions/deploy-pages@v4
